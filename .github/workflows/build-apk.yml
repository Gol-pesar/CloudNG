name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"

          VERSION_TOKEN="$(echo "$JAVA_VER_OUTPUT" | head -n 1 | sed -E 's/.*version "([^"]+)".*/\1/')"
          if [[ -z "$VERSION_TOKEN" || "$VERSION_TOKEN" == "$JAVA_VER_OUTPUT" ]]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if [[ "$VERSION_TOKEN" == 1.* ]]; then
            MAJOR_VERSION="$(echo "$VERSION_TOKEN" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "$VERSION_TOKEN" | cut -d'.' -f1 | sed -E 's/[^0-9].*//')"
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse active Java major version from '${VERSION_TOKEN}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if (( MAJOR_VERSION < 17 )); then
            echo "::error::Java 17 or newer is required, but found Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [[ ! -x "$KEYTOOL_BIN" ]]; then
            echo "::error::keytool was not found under JAVA_HOME (${JAVA_HOME})."
            exit 1
          fi

          if [[ ! -f "./debug.keystore" ]]; then
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null
          fi

          if [[ ! -f "./debug.keystore" || ! -s "./debug.keystore" ]]; then
            echo "::error::Temporary debug keystore ./debug.keystore was not created."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -e "$APK_PATH" ]]; then
            echo "::error::Expected debug APK not found at ${APK_PATH}."
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::${APK_PATH} is not a regular file."
            exit 1
          fi

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::${APK_PATH} is empty."
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::${APK_PATH} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${APK_PATH}"

      - name: Upload debug APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$SOURCE_APK" || ! -s "$SOURCE_APK" ]]; then
            echo "::error::Verified APK missing at ${SOURCE_APK}."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$SANITIZED_REPO" ]]; then
            SANITIZED_REPO="android-app"
          fi

          TEMP_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [[ ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"
          if [[ -z "$ASSET_PATH" || ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release asset is missing or invalid; skipping GitHub Release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          {
            printf 'This is an automatically generated debug APK built by GitHub Actions.\n\n'
            printf -- '- **Workflow run number:** %s\n' "${GITHUB_RUN_NUMBER}"
            printf -- '- **Workflow run attempt:** %s\n' "${GITHUB_RUN_ATTEMPT}"
            printf -- '- **Source commit SHA:** `%s`\n' "${GITHUB_SHA}"
            printf -- '- **Asset:** `%s`\n\n' "${ASSET_NAME}"
            printf 'This APK is intended for testing only. It is not a Play Store production release and is signed only with a temporary debug keystore.\n'
          } > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${GITHUB_SHA}" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          UPLOAD_OUTCOME="${{ steps.upload_apk_artifact.outcome }}"
          PREPARE_OUTCOME="${{ steps.prepare_release_asset.outcome }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [[ "$UPLOAD_OUTCOME" != "success" ]]; then
            echo "::warning::Debug APK build or artifact upload did not complete successfully."
            {
              printf '### Debug APK Build Failed\n\n'
              printf 'The debug APK build or artifact upload (`app-debug-apk`) did not succeed.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$PREPARE_OUTCOME" == "success" && "$RELEASE_OUTCOME" == "success" ]]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            if [[ -z "$RELEASE_URL" ]] || ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET_NAME"; then
              echo "::warning::Release was created, but release asset verification could not confirm ${ASSET_NAME}."
              {
                printf '### APK Build & Artifact Succeeded (Release Verification Warning)\n\n'
                printf -- '- The debug APK build succeeded and the Actions artifact `app-debug-apk` is available.\n'
                printf -- '- Release asset verification for `%s` returned an unexpected result.\n' "${ASSET_NAME}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Release APK asset: ${ASSET_NAME}"

            {
              printf '### Debug APK Built & Published\n\n'
              printf -- '- **Release tag:** `%s`\n' "${RELEASE_TAG}"
              printf -- '- **Release title:** %s\n' "${RELEASE_TITLE}"
              printf -- '- **Release page:** %s\n' "${RELEASE_URL}"
              printf -- '- **APK asset filename:** `%s`\n\n' "${ASSET_NAME}"
              printf 'Download the APK directly from the **Assets** section on the GitHub Release page above.\n'
              printf 'The normal GitHub Actions artifact (`app-debug-apk`) is also available as a backup.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and artifact upload succeeded."
            echo "Backup Actions artifact available: app-debug-apk"
            {
              printf '### Debug APK Built (GitHub Release Publishing Failed)\n\n'
              printf '> **Warning:** Publishing to GitHub Releases failed, so no GitHub Release link is available for this run.\n\n'
              printf -- '- The debug APK build succeeded.\n'
              printf -- '- The normal GitHub Actions artifact named `app-debug-apk` remains available for download.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
